name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if hash matches'
        required: false
        default: false
        type: boolean

  repository_dispatch:
    types: [trigger-workflow]

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_FILE: build_hash
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/yohaku

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(hash):') }}

    outputs:
      hash_content: ${{ steps.read_hash.outputs.hash_content }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read HASH_FILE content
        id: read_hash
        run: |
          content=$(cat ${{ env.HASH_FILE }}) || true
          echo "hash_content=$content" >> "$GITHUB_OUTPUT"

  check:
    name: Check Should Rebuild
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      canceled: ${{ steps.compare.outputs.canceled }}
      sha_short: ${{ steps.compare.outputs.sha_short }}
      sha_full: ${{ steps.compare.outputs.sha_full }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: innei-dev/yohaku
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Compare hash
        id: compare
        env:
          FILE_HASH: ${{ needs.prepare.outputs.hash_content }}
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: |
          file_hash=$FILE_HASH
          current_hash=$(git rev-parse --short HEAD)
          echo "File Hash: $file_hash"
          echo "Current Git Hash: $current_hash"
          echo "Force Build: $FORCE_BUILD"
          echo "sha_short=$current_hash" >> "$GITHUB_OUTPUT"
          echo "sha_full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_BUILD" == "true" ]; then
            echo "Force build enabled. Continuing workflow."
          elif [ "$file_hash" == "$current_hash" ]; then
            echo "Hashes match. Stopping workflow."
            echo "canceled=true" >> $GITHUB_OUTPUT
          else
            echo "Hashes do not match. Continuing workflow."
          fi

  build:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.canceled != 'true' }}

    outputs:
      sha_short: ${{ needs.check.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: innei-dev/yohaku
          token: ${{ secrets.GH_PAT }}
          ref: ${{ needs.check.outputs.sha_full }}
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check.outputs.sha_short }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_URL=${{ secrets.BASE_URL }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ${{ secrets.DEPLOY_COMPOSE_PATH }}
            docker compose pull ${{ secrets.DEPLOY_SERVICE_NAME }}
            docker compose up -d ${{ secrets.DEPLOY_SERVICE_NAME }}
            docker image prune -f

      - name: Check after deploy script
        id: check_script
        run: |
          if [ -n "$AFTER_DEPLOY_SCRIPT" ]; then
            echo "has_script=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          AFTER_DEPLOY_SCRIPT: ${{ secrets.AFTER_DEPLOY_SCRIPT }}

      - name: After deploy script
        if: steps.check_script.outputs.has_script == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: HASH
          script: ${{ secrets.AFTER_DEPLOY_SCRIPT }}
        env:
          HASH: ${{ needs.build.outputs.sha_short }}

      - name: Notify Bark
        if: ${{ success() }}
        continue-on-error: true
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          SHA_SHORT: ${{ needs.build.outputs.sha_short }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          FORCE_BUILD: ${{ github.event.inputs.force_build || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "${BARK_URL:-}" ]; then
            echo "::notice::BARK_URL is not set; skipping Bark notification."
            exit 0
          fi

          BARK_ENDPOINT="$(printf '%s' "$BARK_URL" | tr -d '[:space:]')"
          BARK_ENDPOINT="${BARK_ENDPOINT%/}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(printf "Commit: %s\nImage: ghcr.io/%s:%s\nTrigger: %s #%s" \
            "$SHA_SHORT" "$IMAGE_NAME" "$SHA_SHORT" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_NUMBER")
          if [ "${FORCE_BUILD,,}" = "true" ]; then
            BODY="${BODY} (force)"
          fi

          jq -n \
            --arg title "🚀 Yohaku 部署成功" \
            --arg body "$BODY" \
            --arg group "yohaku-deploy" \
            --arg url "$RUN_URL" \
            '{title: $title, body: $body, group: $group, url: $url, level: "active"}' \
            | curl -sS -f --max-time 15 -X POST "$BARK_ENDPOINT" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d @-

  store:
    name: Store artifact commit version
    runs-on: ubuntu-latest
    needs: [deploy, build]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Write hash to file
        env:
          SHA_SHORT: ${{ needs.build.outputs.sha_short }}
        run: echo $SHA_SHORT > ${{ env.HASH_FILE }}

      - name: Commit files
        env:
          SHA_SHORT: ${{ needs.build.outputs.sha_short }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ${{ env.HASH_FILE }}
          git commit -m "chore(hash): update to $SHA_SHORT"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  notify-failure:
    name: Notify Bark (on failure)
    runs-on: ubuntu-latest
    needs: [prepare, check, build, deploy, store]
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.check.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.store.result == 'failure') }}

    steps:
      - name: Notify Bark
        continue-on-error: true
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          RES_PREPARE: ${{ needs.prepare.result }}
          RES_CHECK: ${{ needs.check.result }}
          RES_BUILD: ${{ needs.build.result }}
          RES_DEPLOY: ${{ needs.deploy.result }}
          RES_STORE: ${{ needs.store.result }}
          SHA_SHORT: ${{ needs.check.outputs.sha_short || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "${BARK_URL:-}" ]; then
            echo "::notice::BARK_URL is not set; skipping Bark notification."
            exit 0
          fi

          FAILED_JOBS=""
          for pair in \
            "prepare:$RES_PREPARE" \
            "check:$RES_CHECK" \
            "build:$RES_BUILD" \
            "deploy:$RES_DEPLOY" \
            "store:$RES_STORE"; do
            name="${pair%%:*}"
            res="${pair#*:}"
            if [ "$res" = "failure" ]; then
              FAILED_JOBS="${FAILED_JOBS:+${FAILED_JOBS}, }${name}"
            fi
          done
          FAILED_JOBS="${FAILED_JOBS:-unknown}"

          BARK_ENDPOINT="$(printf '%s' "$BARK_URL" | tr -d '[:space:]')"
          BARK_ENDPOINT="${BARK_ENDPOINT%/}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(printf "Failed job: %s\nCommit: %s\nTrigger: %s #%s" \
            "$FAILED_JOBS" "${SHA_SHORT:-N/A}" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_NUMBER")

          jq -n \
            --arg title "❌ Yohaku 部署失败" \
            --arg body "$BODY" \
            --arg group "yohaku-deploy" \
            --arg url "$RUN_URL" \
            '{title: $title, body: $body, group: $group, url: $url, level: "timeSensitive"}' \
            | curl -sS -f --max-time 15 -X POST "$BARK_ENDPOINT" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d @-
